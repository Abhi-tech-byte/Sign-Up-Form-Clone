<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up-Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="left-side-page">
            <div class="odin-logo">
                <img src="assets/icons/odin-lined.png" alt="odin-logo">
                <h1 class="odin-text">ODIN</h1>
            </div>
            <p class="attribution">
                Photo by Halie West on Unsplash
            </p>

        </div>

        <div class="right-side-page">
            <div class="intro">
                <div class="intro-top">
                    <p>This is not a real online service! You know you need something like this in your life to help you
                        realize your deepest dreams</p>
                    <p>Sign up <i>now</i> to get started</p>
                </div>
                <div class="intro-bottom">
                    <p class="sub-intro2">You know you want to:</p>

                </div>


            </div>

            <div class="form">
                <h2>Lets do this!</h2>
                <form action="">
                    <div class="left-form">
                        <label for="First_name">FIRST NAME</label>
                        <input type="text" id="First_name">

                        <label for="email">EMAIL</label>
                        <input type="email" id="email">

                        <label for="Password">PASSWORD</label>
                        <input type="text" id="Password">
                    </div>

                </form>

            </div>
            <button>Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>

        </div>

    </div>

</body>

</html>
